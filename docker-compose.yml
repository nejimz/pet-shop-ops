services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-3101}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/dev.db
      UPLOADS_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Use DOCKER_* so root .env NEXT_PUBLIC_API_URL (port 3001) does not win.
        NEXT_PUBLIC_API_URL: ${DOCKER_NEXT_PUBLIC_API_URL:-http://localhost:3101}
    ports:
      - "${WEB_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
